<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>敗家表</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fbf6e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17120d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="敗家表">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* tastemaker · surface: app shell (collector's cabinet) · mood: warm (reference: user's 谷柜 screenshot, cream + gold badges) · palette: hand-tuned from generate_palette --mood warm, contrast matrix pass · type: Noto Sans TC + Nunito numerals · icons: tabler · motion: app-shell track */
/* Layout: cream "shelf" background, white cards like labelled boxes, price-tag hero. One column on phones, two on wide screens. Sticky header with icon tabs, floating 記一筆 button. */
:root {
  --bg: #fbf6e9;
  --surface: #fffdf6;
  --sunk: #f2ead6;
  --ink: #2b2118;
  --ink-2: #5f5142;
  --ink-3: #74644f;
  --line: #e6d9bd;
  --accent: #c23a68;
  --accent-ink: #ffffff;
  --accent-soft: #f8dfe6;
  --gold: #f3c969;
  --gold-soft: #fbedc3;
  --gold-line: #d9a93a;
  --gain: #147d6c;
  --gain-soft: #d9efe8;
  --warn: #9a5800;
  --warn-soft: #fbe9c8;
  --scrim: rgba(43, 33, 24, .5);
  --photo-chip: rgba(43, 33, 24, .62);
  --photo-chip-ink: #fffdf6;
  --c0: #c23a68; --c1: #147d6c; --c2: #c28400; --c3: #3d6fc4; --c4: #8e4fa8; --c5: #5b8a2a; --c6: #d0602d; --c7: #8a7a68;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Nunito", "Noto Sans TC", system-ui, sans-serif;
  --r-xs: 6px; --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-pill: 999px;
  --shadow: 0 1px 0 rgba(120, 90, 40, .06), 0 6px 18px -8px rgba(120, 90, 40, .22);
  --shadow-lift: 0 2px 0 rgba(120, 90, 40, .08), 0 14px 30px -12px rgba(120, 90, 40, .35);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120d; --surface: #211a13; --sunk: #2b2219; --ink: #f6ecdd; --ink-2: #d2c2ad; --ink-3: #a8977f; --line: #3a2e22;
    --accent: #f07ea3; --accent-ink: #1a0b12; --accent-soft: #3d1f2b; --gold: #e2b44f; --gold-soft: #3a2e17; --gold-line: #8f6f25;
    --gain: #45c4b2; --gain-soft: #163430; --warn: #f0b04a; --warn-soft: #3a2d14;
    --scrim: rgba(0, 0, 0, .6); --photo-chip: rgba(0, 0, 0, .62); --photo-chip-ink: #f6ecdd;
    --c0: #f07ea3; --c1: #45c4b2; --c2: #e2b44f; --c3: #7aa2ee; --c4: #c08ae0; --c5: #93c768; --c6: #f08a5d; --c7: #a8977f;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 10px 28px -10px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17120d; --surface: #211a13; --sunk: #2b2219; --ink: #f6ecdd; --ink-2: #d2c2ad; --ink-3: #a8977f; --line: #3a2e22;
  --accent: #f07ea3; --accent-ink: #1a0b12; --accent-soft: #3d1f2b; --gold: #e2b44f; --gold-soft: #3a2e17; --gold-line: #8f6f25;
  --gain: #45c4b2; --gain-soft: #163430; --warn: #f0b04a; --warn-soft: #3a2d14;
  --scrim: rgba(0, 0, 0, .6); --photo-chip: rgba(0, 0, 0, .62); --photo-chip-ink: #f6ecdd;
  --c0: #f07ea3; --c1: #45c4b2; --c2: #e2b44f; --c3: #7aa2ee; --c4: #c08ae0; --c5: #93c768; --c6: #f08a5d; --c7: #a8977f;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3); --shadow-lift: 0 10px 28px -10px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
/* phone platform layer: no tap flash, no font inflation, no page bounce behind sheets */
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
/* iOS zooms into any input under 16px and never zooms back out */
input, select, textarea { font-size: 16px; }
/* controls fire on tap without the double-tap wait, and a long press doesn't select their label */
button, label.btn, label.add, .tabs button, .seg button, .chip { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand .mark { width: 34px; height: 34px; flex: none; image-rendering: pixelated; }
.brand .word { font-weight: 900; font-size: 20px; letter-spacing: .06em; color: var(--ink); }
.brand small { color: var(--ink-3); font-size: 12px; }
nav.tabs { display: flex; gap: 2px; background: var(--sunk); border-radius: var(--r-pill); padding: 4px; }
nav.tabs button { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; border: 0; background: transparent; padding: 4px 13px; border-radius: var(--r-pill); color: var(--ink-2); font-weight: 500; white-space: nowrap; transition: background-color .15s, color .15s; }
nav.tabs button[aria-current="page"] { background: var(--surface); color: var(--accent); font-weight: 700; box-shadow: var(--shadow); }
/* narrow phones: the four tabs share the full width, icon above label, so none is cut off */
@media (max-width: 440px) {
  nav.tabs { flex: 1 1 100%; }
  nav.tabs button { flex: 1 1 0; min-width: 0; flex-direction: column; justify-content: center; gap: 1px; min-height: 48px; padding: 4px 2px; font-size: 12px; border-radius: 14px; }
  nav.tabs .ic { width: 20px; height: 20px; }
}

main { padding-block: 18px 116px; }
.view { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.card h2 { font-size: 16px; margin: 0 0 14px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; text-wrap: balance; }
.card h2 small { color: var(--ink-3); font-weight: 400; font-size: 12px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* hero: a price tag hanging from the shelf */
.hero { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px 20px 18px; overflow: hidden; box-shadow: var(--shadow); }
.hero::after { content: ""; position: absolute; inset: 0 0 auto auto; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, var(--gold-soft) 0 55%, transparent 56%); transform: translate(40%, -45%); pointer-events: none; }
.hero .eyebrow { position: relative; z-index: 1; color: var(--ink-3); font-size: 12px; letter-spacing: .1em; }
/* the total shrinks with its own digit count, so seven figures still fit a 320px phone */
.hero .big { position: relative; z-index: 1; font-size: clamp(30px, min(12vw, calc((100vw - 130px) / (var(--digits, 7) * .6))), 80px); white-space: nowrap; font-weight: 800; line-height: 1; margin: 8px 0 6px; color: var(--ink); letter-spacing: -.01em; }
.hero .big .cur { font-size: .38em; color: var(--accent); margin-right: 6px; vertical-align: .6em; font-weight: 800; }
.hero .sub { position: relative; z-index: 1; color: var(--ink-2); font-size: 13px; }
.hero .punch { position: absolute; z-index: 1; right: 20px; top: 20px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2px solid var(--gold-line); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-top: 1px dashed var(--line); margin: 18px -20px -18px; }
@media (min-width: 640px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stats > div { background: var(--surface); padding: 12px clamp(12px, 4vw, 20px); display: grid; gap: 2px; min-width: 0; }
.stats .k { font-size: 12px; color: var(--ink-3); }
.stats .v { font-size: clamp(14px, 4.6vw, 24px); font-weight: 800; line-height: 1.15; white-space: nowrap; }
.stats .v.gain { color: var(--gain); }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--r-md); font-size: 14px; border: 1px solid var(--gold-line); }
.banner.warn { background: var(--gold-soft); color: var(--ink); }
.banner .grow { flex: 1 1 200px; min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: 1px solid var(--line); background: var(--surface); padding: 7px 15px; border-radius: var(--r-sm); font-weight: 500; transition: border-color .15s, background-color .15s, transform .12s var(--ease-out); }
.btn:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .btn:hover { border-color: var(--ink-3); } }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--accent); }
.btn.icon { padding: 0; width: 40px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: var(--r-pill); background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.sold { background: var(--gain-soft); color: var(--gain); }
.chip.selling { background: var(--accent-soft); color: var(--accent); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font-family: var(--font-num); font-size: 12px; font-weight: 700; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.chart .hit { fill: transparent; cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .chart .hit:hover { fill: var(--sunk); opacity: .5; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: var(--r-pill); margin-right: 5px; vertical-align: -1px; }
.note { font-size: 12px; color: var(--ink-3); margin-top: 8px; }

.rank { display: grid; gap: 12px; }
.rank button { display: grid; grid-template-columns: minmax(0, 7em) minmax(0, 1fr) auto; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; min-height: 28px; }
.rank .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .bar { height: 12px; background: var(--sunk); border-radius: var(--r-pill); overflow: hidden; display: flex; }
.rank .bar span { display: block; height: 100%; }
.rank .val { font-size: 16px; font-weight: 800; min-width: 5.5em; text-align: right; }
@media (hover: hover) and (pointer: fine) { .rank button:hover .name { color: var(--accent); } }

.curbar { display: flex; height: 18px; border-radius: var(--r-pill); overflow: hidden; background: var(--sunk); }
.curbar span { display: block; height: 100%; }
.curlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; margin-top: 12px; font-size: 13px; }
.curlist div { display: flex; justify-content: space-between; gap: 8px; }
.curlist b { font-family: var(--font-num); font-size: 15px; font-weight: 800; }

/* list */
.filters { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .filters { grid-template-columns: 2fr repeat(4, minmax(0, 1fr)) auto; } }
.filters .q { grid-column: 1 / -1; }
@media (min-width: 760px) { .filters .q { grid-column: auto; } }
.field, .filters input, .filters select { width: 100%; min-width: 0; min-height: 42px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 8px 11px; }
.toggle input { width: 18px; height: 18px; min-height: 0; margin: 0; accent-color: var(--accent); }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; font-size: 14px; white-space: nowrap; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 11px; background: var(--surface); }
.summary-line { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); font-size: 13px; flex-wrap: wrap; }
.items { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 56px; padding: 10px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.row:last-child { border-bottom: 0; }
.row:active { background: var(--sunk); }
@media (hover: hover) and (pointer: fine) { .row:hover { background: var(--sunk); } }
.row .dot { width: 10px; height: 10px; border-radius: var(--r-pill); }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.row .p { text-align: right; display: grid; justify-items: end; gap: 2px; }
.row .p b { font-family: var(--font-num); font-size: 17px; font-weight: 800; white-space: nowrap; }
.row .m > span:not(.chip) + span:not(.chip)::before { content: "·"; margin-right: 6px; }
.row .m .nw { white-space: nowrap; }
.row .m .ser { max-width: 12em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 倉庫 */
.cabinet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .cabinet { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 920px) { .cabinet { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.cabinet > .empty { grid-column: 1 / -1; }
.gcard { display: grid; gap: 6px; align-content: start; min-width: 0; padding: 7px 7px 10px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-align: left; box-shadow: var(--shadow); transition: transform .2s var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .gcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); } }
.gcard:active { transform: scale(.98); }
.gcard .pic { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: var(--r-sm); overflow: hidden; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 12%, var(--sunk)); }
.gcard .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* no photo yet: a labelled storage box in the category's colour, so the shelf still reads item by item */
.gcard .pic.blank { background:
  radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--cc) 30%, transparent) 1px, transparent 1.5px) 0 0 / 12px 12px,
  color-mix(in srgb, var(--cc) 10%, var(--surface)); }
.gcard .ph-text { display: grid; gap: 6px; justify-items: center; padding: 12px; text-align: center; min-width: 0; color: color-mix(in srgb, var(--cc) 80%, var(--ink)); }
.gcard .ph-text b { font-size: clamp(22px, 7vw, 30px); font-weight: 900; line-height: 1.1; letter-spacing: .02em; overflow-wrap: anywhere; }
.gcard .ph-text small { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); background: var(--surface); padding: 1px 8px; border-radius: var(--r-pill); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gcard .qty { position: absolute; right: 6px; bottom: 6px; background: var(--gold-soft); color: var(--ink); border: 1.5px solid var(--gold-line); border-radius: var(--r-pill); padding: 0 9px; font-size: 14px; font-weight: 800; line-height: 1.5; }
.gcard .stt { position: absolute; left: 6px; top: 6px; }
.gcard .flagdot { position: absolute; right: 8px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 2px var(--surface); }
.gcard .nm { font-size: 14px; font-weight: 500; padding: 0 4px; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gcard .pr { padding: 0 4px; color: var(--ink); font-size: clamp(13px, 4.2vw, 16px); font-weight: 800; white-space: nowrap; }
.gcard .pcount { position: absolute; left: 6px; bottom: 6px; display: inline-flex; align-items: center; gap: 3px; background: var(--photo-chip); color: var(--photo-chip-ink); border-radius: var(--r-pill); padding: 0 8px; font-size: 12px; line-height: 1.6; }
.empty { text-align: center; padding: 44px 16px; color: var(--ink-3); }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }

/* fab */
.fab { position: fixed; z-index: 6; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: inline-flex; align-items: center; gap: 6px; min-height: 52px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 16px; padding: 0 22px 0 18px; border-radius: var(--r-pill); box-shadow: var(--shadow-lift); transition: transform .15s var(--ease-out); }
.fab:active { transform: scale(.96); }
.fab .ic { width: 22px; height: 22px; }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; justify-content: center; align-items: flex-end; }
@media (min-width: 760px) { .overlay { align-items: center; } }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 16px); box-shadow: var(--shadow-lift); }
@media (min-width: 760px) { .sheet { border-radius: var(--r-lg); } }
.sheet-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); z-index: 1; }
.sheet-head h3 { margin: 0 auto 0 0; font-size: 17px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head h3.clamp2 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; overflow-wrap: anywhere; }
.form { display: grid; gap: 14px; padding: 16px 18px; }
.form label.l { display: block; font-size: 12px; color: var(--ink-3); margin-bottom: 4px; letter-spacing: .04em; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.parts { display: grid; gap: 6px; }
.part { display: grid; grid-template-columns: minmax(0, 1fr) 8.5em auto; gap: 6px; }
.part .x { display: grid; place-items: center; width: 36px; border: 0; background: none; color: var(--ink-3); padding: 0; }
.hkd { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.hkd input { width: 8em; }
.seg { display: flex; background: var(--sunk); border-radius: var(--r-sm); padding: 3px; }
.seg button { flex: 1; min-height: 36px; border: 0; background: none; padding: 6px 2px; border-radius: var(--r-xs); color: var(--ink-2); white-space: nowrap; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
.photos { display: flex; flex-wrap: wrap; gap: 8px; }
.photos .ph { position: relative; width: 84px; height: 84px; border-radius: var(--r-sm); overflow: hidden; background: var(--sunk); }
.photos .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .ph button { position: absolute; top: 3px; right: 3px; display: grid; place-items: center; border: 0; border-radius: 50%; width: 24px; height: 24px; padding: 0; background: var(--photo-chip); color: var(--photo-chip-ink); }
.photos .ph .cover { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); color: var(--accent-ink); font-size: 11px; text-align: center; }
.photos .ph .mkcover { top: auto; bottom: 3px; left: 3px; right: 3px; width: auto; height: 22px; border-radius: var(--r-xs); font-size: 11px; }
.photos .add { width: 84px; height: 84px; border: 1.5px dashed var(--ink-3); border-radius: var(--r-sm); display: grid; place-items: center; align-content: center; gap: 2px; color: var(--ink-3); font-size: 12px; text-align: center; cursor: pointer; }
.imp-bar { height: 8px; border-radius: var(--r-pill); background: var(--sunk); overflow: hidden; }
.imp-bar span { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transition: transform .3s var(--ease-out); }
/* the gallery owns horizontal swipes between photos; vertical stays with the sheet's scroll */
.gallery { touch-action: pan-y; position: relative; display: grid; place-items: center; background: color-mix(in srgb, var(--cc) 10%, var(--sunk)); min-height: 240px; }
.gallery img { display: block; width: 100%; max-height: min(62vh, 560px); object-fit: contain; }
.gallery-empty { display: grid; gap: 4px; justify-items: center; padding: 60px 16px; color: color-mix(in srgb, var(--cc) 80%, var(--ink)); text-align: center; }
.gallery-empty b { font-size: 26px; font-weight: 900; }
.gnav { position: absolute; top: 50%; transform: translateY(-50%); display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; padding: 0; background: var(--photo-chip); color: var(--photo-chip-ink); }
.gnav .ic { width: 24px; height: 24px; }
.gnav.prev { left: 10px; } .gnav.next { right: 10px; }
.gcount { position: absolute; right: 10px; bottom: 10px; background: var(--photo-chip); color: var(--photo-chip-ink); border-radius: var(--r-pill); padding: 1px 10px; font-size: 13px; font-weight: 700; }
.thumbs { display: flex; gap: 6px; overflow-x: auto; overscroll-behavior-x: contain; padding: 10px 18px 0; }
.thumbs button { flex: 0 0 auto; width: 56px; height: 56px; padding: 0; border: 2px solid transparent; border-radius: var(--r-sm); overflow: hidden; background: var(--sunk); }
.thumbs button[data-on] { border-color: var(--accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dinfo { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; margin: 0; padding: 14px 18px; font-size: 14px; }
.dinfo dt { color: var(--ink-3); }
.dinfo dd { margin: 0; overflow-wrap: anywhere; }
.dinfo small { color: var(--ink-3); }
.legacy { font-size: 12px; color: var(--ink-3); word-break: break-all; }
.flagbox { background: var(--warn-soft); color: var(--warn); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
details.raw { font-size: 12px; color: var(--ink-3); }
details.raw pre { white-space: pre-wrap; word-break: break-all; background: var(--sunk); padding: 8px; border-radius: var(--r-xs); margin: 6px 0 0; }
.sheet-foot { display: flex; gap: 8px; padding: 0 18px; flex-wrap: wrap; }
.sheet-foot .grow { flex: 1; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--accent); }

/* settings */
.set-list { display: grid; }
.set-row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 52px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.set-row .acts .btn { min-height: 40px; padding: 4px 11px; font-size: 13px; }
.set-row .acts .btn.icon { width: 40px; padding: 0; }
.rates { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.rates label { display: grid; grid-template-columns: 3.5em minmax(0, 1fr); align-items: center; gap: 6px; font-size: 13px; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.inline .field { flex: 1 1 160px; width: auto; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: var(--r-pill); font-size: 14px; max-width: calc(100% - 32px); box-shadow: var(--shadow-lift); }

/* loading: skeleton shelf instead of a line of text */
.skel { display: grid; gap: 16px; }
.skel i { display: block; border-radius: var(--r-md); background: var(--sunk); }
.skel .h { height: 170px; } .skel .c { height: 260px; }

/* motion (app-shell track): views and the first cards ease in; sheets rise; all of it collapses to a fade with reduced motion */
@media (prefers-reduced-motion: no-preference) {
  .view.enter { animation: view-in .26s var(--ease-out); }
  .cabinet.enter > .gcard:nth-child(-n+20), .items.enter > .row:nth-child(-n+20) { animation: item-in .26s var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 18ms); }
  .overlay { animation: fade-in .18s var(--ease-out); }
  .overlay .sheet { animation: sheet-up .26s var(--ease-out); }
  .toast { animation: toast-in .22s var(--ease-out); }
  /* loading pulse: a slow loop on purpose, it only shows while the store opens */
  .skel i { animation: shimmer 1.2s cubic-bezier(.45, 0, .55, 1) infinite alternate; }
  @keyframes view-in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes item-in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes sheet-up { from { transform: translateY(32px); opacity: .5; } }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
  @keyframes shimmer { from { opacity: .55; } to { opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) {
  .view.enter, .overlay { animation: fade-in .15s linear; }
  @keyframes fade-in { from { opacity: 0; } }
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// Local-only backend: everything lives in this browser's IndexedDB. It answers the same
// claude.use("db" | "assets" | "downloads" | "user") calls the app was written against.
(() => {
  const DB_NAME = 'baijia', DB_VER = 1;
  let dbp = null;
  const idb = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => { r.result.createObjectStore('docs'); r.result.createObjectStore('blobs'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  // run fn(store) inside one transaction; resolves when the transaction commits
  async function tx(store, mode, fn) {
    const d = await idb();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      fn(t.objectStore(store));
      t.oncomplete = () => res();
      t.onerror = t.onabort = () => rej(t.error);
    });
  }
  async function readAll(store) {
    const d = await idb();
    return new Promise((res, rej) => {
      const t = d.transaction(store);
      const s = t.objectStore(store);
      const keys = s.getAllKeys(), vals = s.getAll();
      t.oncomplete = () => res(keys.result.map((k, i) => [k, vals.result[i]]));
      t.onerror = () => rej(t.error);
    });
  }

  const docs = new Map(), blobs = new Map(), urls = new Map();
  const ready = (async () => {
    for (const [k, v] of await readAll('docs')) docs.set(k, v);
    for (const [k, v] of await readAll('blobs')) blobs.set(k, v);
  })();

  const listeners = new Set();
  const snapDoc = path => { const d = docs.get(path); return { id: path.split('/').pop(), exists: !!d, data: () => d, metadata: { fromCache: false, hasPendingWrites: false } }; };
  const colSnap = col => { const ds = [...docs.keys()].filter(k => k.split('/')[0] === col).sort().map(snapDoc); return { docs: ds, size: ds.length, empty: !ds.length }; };
  // a burst of writes (bulk photo import) reaches listeners once per tick
  const pending = new Set();
  let flushing = false;
  function changed(path) {
    pending.add(path);
    if (flushing) return;
    flushing = true;
    setTimeout(() => {
      flushing = false;
      const paths = [...pending]; pending.clear();
      for (const l of listeners) {
        if (l.doc && paths.includes(l.doc)) l.cb(snapDoc(l.doc));
        if (l.col && paths.some(p => p.split('/')[0] === l.col)) l.cb(colSnap(l.col));
      }
    }, 0);
  }
  const clone = o => JSON.parse(JSON.stringify(o));
  const merge = (a, b) => {
    for (const [k, v] of Object.entries(b)) {
      if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], v);
      else a[k] = v;
    }
    return a;
  };
  async function put(path, val) { docs.set(path, val); await tx('docs', 'readwrite', s => s.put(val, path)); changed(path); }

  const db = {
    doc(path) {
      return {
        id: path.split('/').pop(), path,
        async get() { await ready; return snapDoc(path); },
        async set(d) { await ready; await put(path, clone(d)); },
        async update(d) {
          await ready;
          if (!docs.has(path)) throw { code: 'invalid_argument', message: 'document does not exist' };
          await put(path, merge(clone(docs.get(path)), clone(d)));
        },
        async delete() { await ready; docs.delete(path); await tx('docs', 'readwrite', s => s.delete(path)); changed(path); },
        onSnapshot(cb) { const l = { doc: path, cb }; listeners.add(l); ready.then(() => listeners.has(l) && cb(snapDoc(path))); return () => listeners.delete(l); },
      };
    },
    collection(col) {
      return {
        doc: id => db.doc(col + '/' + id),
        onSnapshot(cb) { const l = { col, cb }; listeners.add(l); ready.then(() => listeners.has(l) && cb(colSnap(col))); return () => listeners.delete(l); },
      };
    },
  };

  function blobURL(id) {
    if (!urls.has(id)) {
      const b = blobs.get(id);
      if (!b) return '';
      urls.set(id, URL.createObjectURL(b));
    }
    return urls.get(id);
  }
  const newBlobId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const assets = {
    async upload(blob, opts = {}) {
      await ready;
      const id = newBlobId();
      const b = opts.type && blob.type !== opts.type ? new Blob([blob], { type: opts.type }) : blob;
      blobs.set(id, b);
      await tx('blobs', 'readwrite', s => s.put(b, id));
      return { id, url: blobURL(id), sizeBytes: b.size, contentType: b.type };
    },
    async delete(id) {
      const u = urls.get(id);
      if (u) URL.revokeObjectURL(u);
      urls.delete(id); blobs.delete(id);
      await tx('blobs', 'readwrite', s => s.delete(id));
      return { deleted: true };
    },
  };
  const downloads = {
    async save({ filename, data }) {
      const b = data instanceof Blob ? data : new Blob([data]);
      const u = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = u; a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 120000);
      return { status: 'saved' };
    },
  };

  /* 資料包: one zip holding data.json (every document) + photos/<id>.jpg. It is the backup and the way to move between devices. */
  async function exportPackage(onProgress) {
    await ready;
    const zip = new JSZip();
    zip.file('data.json', JSON.stringify({ app: 'baijia', version: 1, exportedAt: new Date().toISOString(), docs: Object.fromEntries(docs) }));
    for (const [id, b] of blobs) zip.file(`photos/${id}.${(b.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg')}`, b);
    return zip.generateAsync({ type: 'blob', compression: 'STORE' }, m => onProgress?.(m.percent));
  }
  async function importPackage(file, onProgress) {
    const zip = await JSZip.loadAsync(file);
    const f = zip.file('data.json');
    if (!f) throw new Error('呢個檔案唔係敗家表資料包');
    const data = JSON.parse(await f.async('string'));
    if (data.app !== 'baijia' || !data.docs) throw new Error('呢個檔案唔係敗家表資料包');
    const photos = zip.file(/^photos\/[^/]+$/);
    // read every photo before touching the stores, so a broken zip leaves this device's data alone
    const read = [];
    for (let i = 0; i < photos.length; i++) {
      const p = photos[i];
      const name = p.name.slice(7);
      const ext = name.split('.').pop().toLowerCase();
      const type = { png: 'image/png', webp: 'image/webp', gif: 'image/gif' }[ext] || 'image/jpeg';
      read.push([name.replace(/\.[^.]+$/, ''), new Blob([await p.async('arraybuffer')], { type })]);
      if (i % 20 === 0) onProgress?.(Math.round(i / photos.length * 90));
    }
    await tx('docs', 'readwrite', s => { s.clear(); for (const [k, v] of Object.entries(data.docs)) s.put(v, k); });
    await tx('blobs', 'readwrite', s => { s.clear(); for (const [k, b] of read) s.put(b, k); });
    onProgress?.(100);
    return { docs: Object.keys(data.docs).length, photos: read.length, exportedAt: data.exportedAt };
  }
  async function usage() {
    try { return await navigator.storage.estimate(); } catch { return null; }
  }
  async function persist() {
    try { return await navigator.storage?.persist?.(); } catch { return false; }
  }

  window.LOCAL = { blobURL, exportPackage, importPackage, usage, persist, ready, photoCount: () => blobs.size };
  window.claude = { use: async name => ({ db, assets, downloads, user: { can: async () => true } })[name] || null };
})();
</script>

function yearChart(t) {

async function uploadPhoto(file) {
  try {
    const blob = await shrink(file);
    const r = await S.assets.upload(blob, { type: 'image/jpeg' });
    if (!editing) { S.assets.delete(r.id).catch(() => {}); return; }
    editing.newPhotos.push(r.id);
    editing.photos.push(r.id);
    renderPhotos();
  } catch (e) {
    console.error(e);
    toast(e?.code === 'too_large' ? '張相太大' : e?.code === 'quota_or_state' ? '相片儲存空間滿咗' : '上載唔到相片');
  }
}
async function shrink(file, max = 1600, quality = 0.84) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); // transparent PNG screenshots would turn black as JPEG
  g.drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close?.();
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', quality));
}

/* ---------- bulk import of the old Excel screenshots ---------- */
const IMP = { files: null, plan: [], missing: 0, running: false, done: 0, total: 0, items: 0, failed: [], finished: false };
function planImport(fileList) {
  const byName = new Map(), byStem = new Map();
  const stem = n => n.toLowerCase().replace(/\.[^.]+$/, '');
  const isHeic = n => /\.heic$/i.test(n);
  for (const f of fileList) {
    const k = f.name.toLowerCase();
    if (!byName.has(k)) byName.set(k, f);
    // a browser-readable copy (e.g. IMG_0229.jpg converted from IMG_0229.HEIC) wins over the original
    if (!isHeic(f.name) && !byStem.has(stem(f.name))) byStem.set(stem(f.name), f);
  }
  IMP.files = byName; IMP.cache = new Map(); IMP.plan = []; IMP.missing = 0; IMP.done = 0; IMP.failed = []; IMP.finished = false;
  for (const it of S.items.values()) {
    const have = new Set((it.photoFiles || []).map(n => n.toLowerCase()));
    const todo = [];
    for (const n of it.imgs || []) {
      if (have.has(n.toLowerCase())) continue;
      let f = byName.get(n.toLowerCase());
      if (!f || isHeic(f.name)) f = byStem.get(stem(n)) || f;
      if (f) todo.push({ ref: n, file: f }); else IMP.missing++;
    }
    if (todo.length) IMP.plan.push({ id: it.id, files: todo });
  }
  IMP.total = IMP.plan.reduce((s, p) => s + p.files.length, 0);
  IMP.items = IMP.plan.length;
}
async function uploadForImport(file) {
  let blob;
  try { blob = await shrink(file, 1280, 0.8); }
  catch { if (/^image\/(jpeg|png|webp|gif)$/.test(file.type) && file.size < 20e6) blob = file; else throw { code: 'decode' }; }
  for (let attempt = 0; ; attempt++) {
    try { return (await S.assets.upload(blob, { type: blob === file ? file.type : 'image/jpeg' })).id; }
    catch (e) {
      if ((e?.code === 'rate_limited' || e?.code === 'store_unavailable') && attempt < 4) { await new Promise(r => setTimeout(r, 2000 * (attempt + 1))); continue; }
      throw e;
    }
  }
}
async function runImport() {
  if (IMP.running || !IMP.plan.length) return;
  IMP.running = true;
  let lock = null;
  try { lock = await navigator.wakeLock?.request('screen'); } catch {}
  const queue = [...IMP.plan];
  let stop = false;
  const worker = async () => {
    while (queue.length && !stop) {
      const p = queue.shift();
      const ids = [], names = [];
      for (const { ref, file } of p.files) {
        // photoFiles keeps the Excel's own filename, so a rerun recognises it even when a converted copy was used
        // several items can point at the same screenshot: upload it once and share the asset
        if (!IMP.cache.has(file)) IMP.cache.set(file, uploadForImport(file));
        try { ids.push(await IMP.cache.get(file)); names.push(ref); }
        catch (e) {
          IMP.failed.push(file.name + (e?.code === 'decode' ? '（格式唔支援）' : ''));
          if (e?.code === 'quota_or_state') stop = true;
        }
        IMP.done++;
        updateImportStatus();
      }
      if (ids.length) {
        await patchItems([p.id], it => ({ photos: [...(it.photos || []), ...ids], photoFiles: [...(it.photoFiles || []), ...names] })).catch(() => {
          IMP.failed.push(`${S.items.get(p.id)?.name || p.id}：儲存失敗`);
        });
      }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  try { await lock?.release(); } catch {}
  IMP.running = false; IMP.finished = true; IMP.plan = [];
  if (stop) IMP.failed.push('相片儲存空間滿咗，未上載嘅已經停咗');
  updateImportStatus();
  toast('舊截圖匯入完成');
}
function importStatusHTML() {
  if (!IMP.files) return `<div class="note">揀你電腦入面放舊截圖嘅資料夾（例如成個 PHOTO 資料夾，連埋入面嘅 HEIC轉JPG），app 會按檔名配對返 Excel 入面記低嘅截圖，縮細之後上載。已經上載過嘅會自動跳過，所以中途停咗可以再揀一次資料夾繼續。</div>`;
  if (IMP.running || IMP.finished) {
    const pct = IMP.total ? Math.round(IMP.done / IMP.total * 100) : 100;
    return `<div class="imp-bar"><span style="transform:scaleX(${pct / 100})"></span></div>
      <div class="note">${IMP.running ? `上載緊… ${IMP.done.toLocaleString()} / ${IMP.total.toLocaleString()} 張（${pct}%）。上載期間唔好閂呢個頁面。` : `完成：上載咗 ${(IMP.done - IMP.failed.length).toLocaleString()} 張。`}</div>
      ${IMP.failed.length ? `<details class="raw"><summary>${IMP.failed.length} 張上載唔到</summary><pre>${esc(IMP.failed.join('\n'))}</pre></details>` : ''}`;
  }
  return `<div class="note">配對到 ${IMP.items.toLocaleString()} 件物品、${IMP.total.toLocaleString()} 張相要上載${IMP.missing ? `；另外 ${IMP.missing} 張喺資料夾搵唔到` : ''}。</div>
    ${IMP.total ? `<div class="inline" style="margin-top:8px"><button class="btn primary" data-act="runimport">開始上載</button></div>` : ''}`;

function updateImportStatus() {

}
/* ---------- 倉庫 detail: every photo of one item, then its details ---------- */
let detail = null;
function openDetail(id) {
  const it = S.items.get(id);
  if (!it) return;
  detail = { id, i: 0, photos: it.photos || [] };
  const info = [
    ['名稱', esc(it.name || '（冇名）')],
    ['分類', esc(it.cat) + (it.series ? ' · ' + esc(it.series) : '')],
    ['日期', it.date || '冇日期'],
    ['數量', '×' + qtyOf(it)],
    ['價錢', money(it.priceHKD) + (it.price?.some(([c]) => c !== 'HKD') ? ` <small>（${esc(partsText(it.price))}）</small>` : '')],
    it.feeHKD ? ['運費＋代購', money(it.feeHKD)] : null,
    it.status !== 'own' ? ['狀態', STATUS[it.status] + (it.soldHKD ? ' · 賣出 ' + money(it.soldHKD) : '')] : null,
    it.tags?.length ? ['標籤', it.tags.map(esc).join('、')] : null,
    it.note ? ['備註', esc(it.note)] : null,
  ].filter(Boolean);
  const n = detail.photos.length;
  $('#sheet-root').innerHTML = `
  <div class="overlay" id="dov">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dv-title">
      <div class="sheet-head"><h3 id="dv-title" class="clamp2">${esc(it.name || '（冇名）')}</h3>
        <button type="button" class="btn ghost" data-act="dclose">關閉</button>
        ${S.canWrite ? '<button type="button" class="btn primary" data-act="dedit">修改</button>' : ''}</div>
      <div class="gallery" style="--cc:${catColor(it.cat)}">
        ${n ? `<img id="dv-img" alt="">` : `<div class="gallery-empty"><b>${esc(initials(it.name))}</b><small>未有相片${S.canWrite ? '，撳「修改」加相' : ''}</small></div>`}
        ${n > 1 ? `<button type="button" class="gnav prev" data-dvstep="-1" aria-label="上一張">${ic('left')}</button><button type="button" class="gnav next" data-dvstep="1" aria-label="下一張">${ic('right')}</button><span class="gcount num" id="dv-count"></span>` : ''}
      </div>
      ${n > 1 ? `<div class="thumbs">${detail.photos.map((p, i) => `<button type="button" data-dv="${i}" aria-label="第 ${i + 1} 張"><img src="${LOCAL.blobURL(p)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
      <dl class="dinfo">${info.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      ${it.links?.length ? `<div class="legacy" style="padding:0 18px">${it.links.filter(l => /^https?:/.test(l)).map(l => `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l.length > 60 ? l.slice(0, 60) + '…' : l)}</a>`).join('<br>')}</div>` : ''}
    </div>
  </div>`;
  if (n) showDetailPhoto(0);
  const g = $('.gallery');
  let x0 = null;
  g.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  g.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) showDetailPhoto(detail.i + (dx < 0 ? 1 : -1));
    x0 = null;
  });
}
function showDetailPhoto(i) {
  if (!detail || !detail.photos.length) return;
  const n = detail.photos.length;
  detail.i = (i + n) % n;
  $('#dv-img').src = LOCAL.blobURL(detail.photos[detail.i]);
  const c = $('#dv-count');
  if (c) c.textContent = `${detail.i + 1} / ${n}`;
  document.querySelectorAll('.thumbs button').forEach((b, k) => b.toggleAttribute('data-on', k === detail.i));
}
function closeDetail() {
  detail = null;
  $('#sheet-root').innerHTML = '';
}

function closeEditor(discard) {
  if (discard && editing?.newPhotos.length && S.assets) for (const p of editing.newPhotos) S.assets.delete(p).catch(() => {});
  editing = null;
  $('#sheet-root').innerHTML = '';
}
async function submitEditor() {
  const name = $('#ed-name').value.trim();
  if (!name) { $('#ed-name').focus(); toast('請填名稱'); return; }
  const it = editing.it;
  const price = readParts($('#ed-price')), fee = readParts($('#ed-fee')), sold = readParts($('#ed-sold'));
  const num = sel => { const v = parseFloat($(sel).value); return isNaN(v) ? 0 : round1(v); };
  const status = $('#ed-status [aria-pressed="true"]')?.dataset.st || 'own';
  let orderId = $('#ed-order').value || null;
  const btn = $('[data-act="save"]');
  btn.disabled = true;
  try {
    if (orderId === '__new') {
      const ofee = readParts($('#ed-ofee'));
      orderId = newId('o');
      const o = { name: $('#ed-oname').value.trim() || `${$('#ed-date').value || today()} 訂單`, date: $('#ed-date').value || today(), fee: ofee, feeHKD: toHKD(ofee), created: new Date().toISOString() };
      await enqueue('orders/' + orderId, () => S.db.doc('orders/' + orderId).set(o)).catch(writeErr);
    }
    const date = $('#ed-date').value || null;
    const flags = (it.flags || []).filter(f => !AUTO_FLAGS.includes(f));
    if (!date) flags.push('冇日期');
    if (!price.length) flags.push('冇價錢');
    const next = {
      ...it, name, qty: Math.max(1, parseInt($('#ed-qty').value, 10) || 1), cat: $('#ed-cat').value, series: $('#ed-series').value.trim() || null, date, status,
      price, fee, sold: status === 'own' && !sold.length ? [] : sold,
      priceHKD: num('#ed-price-hkd'), feeHKD: num('#ed-fee-hkd'), soldHKD: status === 'own' && !sold.length ? 0 : num('#ed-sold-hkd'),
      orderId, tags: $('#ed-tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      note: $('#ed-note').value.trim(), links: $('#ed-links').value.split('\n').map(s => s.trim()).filter(Boolean),
      photos: [...editing.photos],
      flags: editing.clearFlags ? flags.filter(f => AUTO_FLAGS.includes(f)) : flags,
    };
    if (!it.date && !next.fxDate) next.fxDate = date;
    const removed = editing.removedPhotos;
    await saveItem(next);
    if (price[0] && price[0][0] !== S.settings?.lastCur) saveSettings({ lastCur: price[0][0] }).catch(() => {});
    if (removed.length && S.assets) for (const p of removed) if (!photoInUse(p, next.id)) S.assets.delete(p).catch(() => {});
    editing.newPhotos = [];
    closeEditor(false);
    toast(editing === null && !it.id ? '記低咗' : '已儲存');
  } catch (e) {
    btn.disabled = false;
  }
}

/* ---------- category / order / rate ops ---------- */
async function renameCategory(from, to) {
  to = to.trim();
  if (!to || to === from) return;
  const cats = categories();
  const merging = cats.includes(to);
  const ids = [...S.items.values()].filter(i => i.cat === from).map(i => i.id);
  await patchItems(ids, () => ({ cat: to }));
  await saveSettings({ categories: merging ? cats.filter(c => c !== from) : cats.map(c => c === from ? to : c) });
  toast(merging ? `已將「${from}」${ids.length} 件併入「${to}」` : `已改名做「${to}」`);
}

async function exportData(kind) {
  if (!S.downloads) { toast('呢個檢視唔支援下載'); return; }
  const items = [...S.items.values()].sort((a, b) => (a.cat || '').localeCompare(b.cat || '') || (a.date || '').localeCompare(b.date || ''));
  const stamp = today();
  try {
    if (kind === 'json') {
      const data = JSON.stringify({ exportedAt: new Date().toISOString(), settings: S.settings, orders: [...S.orders.values()], items }, null, 1);
      await S.downloads.save({ filename: `敗家表-備份-${stamp}.json`, data });
    } else {
      if (!window.XLSX) { toast('Excel 元件載入唔到，請改用 JSON'); return; }
      const ord = S.orders;
      const rows = items.map(i => ({
        分類: i.cat, 系列: i.series || '', 名稱: i.name, 數量: qtyOf(i), 日期: i.date || '', 狀態: STATUS[i.status] || '',
        價錢: partsText(i.price), '價錢(HK$)': i.priceHKD || 0, 運費: partsText(i.fee), '運費(HK$)': i.feeHKD || 0,
        賣出價: partsText(i.sold), '賣出(HK$)': i.soldHKD || 0, 訂單: i.orderId ? (ord.get(i.orderId)?.name || i.orderId) : '',
        標籤: (i.tags || []).join(', '), 備註: i.note || '', 連結: (i.links || []).join('\n'), 舊截圖: (i.imgs || []).join('\n'),
        待確認: (i.flags || []).join('、'), 來源: i.src || '',
      }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), '物品');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([...ord.values()].map(o => ({ 訂單: o.name, 日期: o.date, 運費: partsText(o.fee), '運費(HK$)': o.feeHKD }))), '訂單');
      const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
      await S.downloads.save({ filename: `敗家表-備份-${stamp}.xlsx`, data: new Blob([buf]) });
    }
    if (S.canWrite) await saveSettings({ lastBackup: new Date().toISOString() });
    toast('已匯出');
    render();
  } catch (e) {
    if (e?.code === 'declined') return;
    console.error(e);
    toast('匯出失敗：' + (e?.message || e?.code || '未知原因'));
  }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  const tab = t.closest('nav.tabs button');
  if (tab) return setView(tab.dataset.view);
  if (t.closest('#fab')) return openEditor(null);
  if (t.id === 'ov') return closeEditor(true);
  const card = t.closest('.gcard[data-id]');
  if (card) return openDetail(card.dataset.id);
  const row = t.closest('.row[data-id]');
  if (row) return openEditor(row.dataset.id);
  const yr = t.closest('[data-year]');
  if (yr) { S.filter = { q: '', cat: '', status: '', year: yr.dataset.year, flag: false }; S.shown = 80; return setView('list'); }
  const rk = t.closest('.rank button[data-cat]');
  if (rk) { S.filter = { q: '', cat: rk.dataset.cat, status: '', year: '', flag: false }; S.shown = 80; return setView('list'); }
  const st = t.closest('#ed-status button');
  if (st) {
    for (const b of st.parentElement.children) b.setAttribute('aria-pressed', b === st);
    $('#ed-soldbox').hidden = st.dataset.st === 'own' && !readParts($('#ed-sold')).length;
    return;
  }
  const ap = t.closest('[data-addpart]');
  if (ap) { $('#' + ap.dataset.addpart).insertAdjacentHTML('beforeend', partRow([S.settings?.lastCur || 'HKD', ''])); return; }
  const x = t.closest('.part .x');
  if (x) { const box = x.closest('.parts'); x.closest('.part').remove(); if (!box.children.length) box.insertAdjacentHTML('beforeend', partRow(['HKD', ''])); recalc(box.id); return; }
  const rp = t.closest('[data-rmphoto]');
  if (rp) {
    const p = rp.dataset.rmphoto;
    editing.photos = editing.photos.filter(q => q !== p);
    if (editing.newPhotos.includes(p)) { editing.newPhotos = editing.newPhotos.filter(q => q !== p); S.assets?.delete(p).catch(() => {}); }
    else editing.removedPhotos.push(p);
    return renderPhotos();
  }
  const cv = t.closest('[data-coverphoto]');
  if (cv) {
    const p = cv.dataset.coverphoto;
    editing.photos = [p, ...editing.photos.filter(q => q !== p)];
    return renderPhotos();
  }
  const dv = t.closest('[data-dv]');
  if (dv) return showDetailPhoto(+dv.dataset.dv);
  if (t.closest('[data-dvstep]')) return showDetailPhoto(detail.i + +t.closest('[data-dvstep]').dataset.dvstep);
  if (t.closest('[data-act="dedit"]')) { const id = detail.id; closeDetail(); return openEditor(id); }
  if (t.closest('[data-act="dclose"]') || t.id === 'dov') return closeDetail();
  const cact = t.closest('[data-cact]');
  if (cact) return categoryAction(cact.dataset.cact, cact.closest('[data-cat]').dataset.cat);
  const oact = t.closest('[data-oact]');
  if (oact) return orderEdit(oact.closest('[data-order]').dataset.order);
  const act = t.closest('[data-act]')?.dataset.act;
  switch (act) {
    case 'close': return closeEditor(true);
    case 'save': return submitEditor();
    case 'clearflags': editing.clearFlags = true; t.closest('.flagbox').innerHTML = '<span>儲存之後會清除待確認標記。</span>'; return;
    case 'askdel': $('#ed-del').innerHTML = `<span class="confirm">真係刪除？刪咗就冇得還原。<button type="button" class="btn danger" data-act="dodel">確認刪除</button><button type="button" class="btn ghost" data-act="nodel">唔好</button></span>`; return;
    case 'nodel': $('#ed-del').innerHTML = `<button type="button" class="btn danger" data-act="askdel">刪除呢件</button>`; return;
    case 'dodel': {
      const it = editing.it;
      await deleteItem(it.id).catch(() => null);
      if (S.assets) for (const p of new Set([...(it.photos || []), ...editing.photos])) if (!photoInUse(p, it.id)) S.assets.delete(p).catch(() => {});
      editing.newPhotos = [];
      closeEditor(false); toast('已刪除'); return;
    }
    case 'flagged': S.filter = { q: '', cat: '', status: '', year: '', flag: true }; S.shown = 80; return setView('list');
    case 'all': S.filter = { q: '', cat: '', status: '', year: '', flag: false }; return setView('list');
    case 'more': S.shown += 80; return renderList();
    case 'runimport': runImport(); return render();
    case 'exportpkg': return exportPkg();
    case 'pkgyes': return doImportPkg();
    case 'pkgno': PKG.file = null; return updatePkgStatus();
    case 'backup': return exportData('xlsx');
    case 'backupjson': return exportData('json');
    case 'addcat': {
      const v = $('#new-cat').value.trim();
      if (!v || categories().includes(v)) return toast(v ? '已經有呢個分類' : '請輸入名稱');
      await saveSettings({ categories: [...categories(), v] }); toast('已加分類'); return render();
    }
    case 'saverates': {
      const rates = { ...(S.settings.rates || {}) };
      for (const c of CURS) { const el = $('#rate-' + c); if (el && el.value !== '') rates[c] = parseFloat(el.value); }
      await saveSettings({ rates, ratesDate: today() }); toast('匯率已儲存'); return render();
    }
  }
});
async function categoryAction(act, cat) {
  const cats = categories();
  const i = cats.indexOf(cat);
  const box = $('#cat-edit');
  if (act === 'up' || act === 'down') {
    const j = act === 'up' ? i - 1 : i + 1;
    [cats[i], cats[j]] = [cats[j], cats[i]];
    await saveSettings({ categories: cats }); return render();
  }
  if (act === 'del') { await saveSettings({ categories: cats.filter(c => c !== cat) }); return render(); }
  if (act === 'rename') {
    box.innerHTML = `<div class="inline" style="margin-top:12px"><span>將「${esc(cat)}」改名做</span><input class="field" id="cat-new" value="${esc(cat)}"><button class="btn primary" id="cat-go">確認</button><button class="btn ghost" id="cat-x">取消</button></div>`;
  } else {
    box.innerHTML = `<div class="inline" style="margin-top:12px"><span>將「${esc(cat)}」全部物品併入</span><select class="field" id="cat-new">${cats.filter(c => c !== cat).map(c => `<option>${esc(c)}</option>`).join('')}</select><button class="btn primary" id="cat-go">確認合併</button><button class="btn ghost" id="cat-x">取消</button></div>`;
  }
  $('#cat-x').onclick = () => box.innerHTML = '';
  $('#cat-go').onclick = async () => { $('#cat-go').disabled = true; await renameCategory(cat, $('#cat-new').value).catch(() => {}); render(); };
}
function orderEdit(oid) {
  const o = S.orders.get(oid);
  const box = $('#order-edit');
  box.innerHTML = `<div style="display:grid;gap:8px;margin-top:12px">
    <input class="field" id="o-name" value="${esc(o.name || '')}" placeholder="訂單名稱">
    <div><label class="l">成張單嘅運費＋代購費</label>${partsEditor('o-fee', o.fee)}</div>
    <div class="inline"><button class="btn primary" id="o-go">儲存訂單</button><button class="btn ghost" id="o-x">取消</button><span class="grow"></span><button class="btn danger" id="o-del">刪除訂單</button></div></div>`;
  $('#o-x').onclick = () => box.innerHTML = '';
  $('#o-go').onclick = async () => {
    const fee = readParts($('#o-fee'));
    const { id: _, ...body } = o;
    await enqueue('orders/' + oid, () => S.db.doc('orders/' + oid).set({ ...body, name: $('#o-name').value.trim(), fee, feeHKD: toHKD(fee) })).catch(writeErr).catch(() => {});
    toast('訂單已儲存');
  };
  $('#o-del').onclick = async () => {
    const ids = [...S.items.values()].filter(i => i.orderId === oid).map(i => i.id);
    if (ids.length) await patchItems(ids, () => ({ orderId: null })).catch(() => {});
    await enqueue('orders/' + oid, () => S.db.doc('orders/' + oid).delete()).catch(writeErr).catch(() => {});
    toast('訂單已刪除，物品保留');
  };
}

function recalc(boxId) {
  const map = { 'ed-price': '#ed-price-hkd', 'ed-fee': '#ed-fee-hkd', 'ed-sold': '#ed-sold-hkd' };
  const out = map[boxId];
  if (!out) return;
  const parts = readParts($('#' + boxId));
  $(out).value = parts.length ? toHKD(parts) : '';
  if (boxId === 'ed-price') {
    const missing = parts.filter(([c]) => !rate(c)).map(([c]) => CUR_SYM[c]);
    $('#ed-price-note').textContent = missing.length ? `未有 ${missing.join('、')} 匯率，請手動填` : parts.some(([c]) => c !== 'HKD') ? '按設定匯率自動計，可以自己改' : '';
  }
}
document.addEventListener('input', e => {
  const t = e.target;
  const box = t.closest('.parts');
  if (box) return recalc(box.id);
  if (t.id === 'f-q') { S.filter.q = t.value; S.shown = 80; return renderList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  const box = t.closest('.parts');
  if (box) return recalc(box.id);
  if (t.id === 'f-cat') S.filter.cat = t.value;
  else if (t.id === 'f-status') S.filter.status = t.value;
  else if (t.id === 'f-year') S.filter.year = t.value;
  else if (t.id === 'f-flag') S.filter.flag = t.checked;
  else if (t.id === 'f-sort') { S.sort = t.value; try { localStorage.setItem('baijia-sort', t.value); } catch {} }
  else if (t.id === 'ed-order') { $('#ed-neworder').hidden = t.value !== '__new'; return; }
  else if (t.id === 'ed-file') { for (const f of t.files) uploadPhoto(f); t.value = ''; return; }
  else if (t.id === 'pkg-file') { if (t.files[0]) askImportPkg(t.files[0]); t.value = ''; return; }
  else if (t.id === 'imp-dir' || t.id === 'imp-files') { if (!IMP.running) { planImport([...t.files]); updateImportStatus(); } t.value = ''; return; }
  else return;
  S.shown = 80; renderList();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && editing) closeEditor(true);
  else if (detail) {
    if (e.key === 'Escape') closeDetail();
    else if (e.key === 'ArrowRight') showDetailPhoto(detail.i + 1);
    else if (e.key === 'ArrowLeft') showDetailPhoto(detail.i - 1);
  }
});
document.addEventListener('paste', e => {
  if (!editing || !S.assets || !S.canWrite) return;
  for (const f of e.clipboardData?.files || []) if (f.type.startsWith('image/')) uploadPhoto(f);
});


/* ---------- 資料包 (local build only) ---------- */
const PKG = { file: null, busy: false, msg: '', usage: null };
function pkgStatusHTML() {
  if (PKG.file) return `<div class="confirm" style="color:var(--ink)">匯入「${esc(PKG.file.name)}」會<b>取代呢部機而家所有紀錄同相片</b>${S.items.size ? `（而家有 ${S.items.size.toLocaleString()} 件）` : ''}。
    <button class="btn danger" data-act="pkgyes">確認匯入</button><button class="btn ghost" data-act="pkgno">取消</button></div>`;
  const u = PKG.usage;
  const used = u?.usage ? ` · 呢部機已用 ${(u.usage / 1048576).toFixed(0)}MB` : '';
  return `<div class="note">${PKG.msg ? esc(PKG.msg) : `資料只存喺呢部機入面。匯出嘅 .zip 包括所有紀錄同 ${LOCAL.photoCount().toLocaleString()} 張相${used}；喺另一部機匯入就會變成一模一樣。兩部機都有改動嘅話，以最後匯入嗰個為準。`}</div>`;
}
function updatePkgStatus() { for (const el of document.querySelectorAll('#pkg-status')) el.innerHTML = pkgStatusHTML(); }
function askImportPkg(file) {
  if (PKG.busy) return;
  PKG.file = file; PKG.msg = '';
  updatePkgStatus();
}
async function doImportPkg() {
  const file = PKG.file;
  if (!file || PKG.busy) return;
  PKG.file = null; PKG.busy = true;
  PKG.msg = '讀緊資料包…'; updatePkgStatus();
  try {
    const r = await LOCAL.importPackage(file, pct => { PKG.msg = `匯入緊… ${pct}%`; updatePkgStatus(); });
    PKG.msg = `匯入完成：${r.photos.toLocaleString()} 張相。重新載入緊…`; updatePkgStatus();
    setTimeout(() => location.reload(), 600);
  } catch (e) {
    console.error(e);
    PKG.busy = false; PKG.msg = '匯入失敗：' + (e?.message || '檔案可能壞咗'); updatePkgStatus();
  }
}
async function exportPkg() {
  if (PKG.busy) return;
  PKG.busy = true; PKG.msg = '整緊資料包…'; updatePkgStatus();
  try {
    const blob = await LOCAL.exportPackage(pct => { PKG.msg = `整緊資料包… ${Math.round(pct)}%`; updatePkgStatus(); });
    await S.downloads.save({ filename: `敗家表資料包-${today()}.zip`, data: blob });
    await saveSettings({ lastBackup: new Date().toISOString() });
    PKG.msg = `已匯出（${(blob.size / 1048576).toFixed(0)}MB）。記得將個 .zip 存去安全嘅地方，例如雲端硬碟。`;
  } catch (e) {
    console.error(e);
    PKG.msg = '匯出失敗：' + (e?.message || '未知原因');
  }
  PKG.busy = false; updatePkgStatus(); render();
}
LOCAL.usage().then(u => { PKG.usage = u; });
LOCAL.persist();

/* ---------- boot ---------- */
async function boot() {
  const initial = (location.hash || '').slice(1);
  if (['overview', 'list', 'cabinet', 'settings'].includes(initial)) setView(initial);
  const [db, assets, downloads, user] = await Promise.all(['db', 'assets', 'downloads', 'user'].map(n => window.claude?.use?.(n) ?? Promise.resolve(null)));
  S.assets = assets; S.downloads = downloads;
  if (!db) { S.dbMissing = true; return render(); }
  S.db = db;
  if (user) {
    try { const w = await user.can('data.write'); if (w === false) S.canWrite = false; } catch {}
  }
  db.collection('chunks').onSnapshot(snap => {
    S.items.clear(); S.chunkOf.clear(); S.chunkSize.clear();
    for (const d of snap.docs) {
      const its = (d.data() || {}).items || {};
      let n = 0;
      for (const [id, it] of Object.entries(its)) { if (!it) continue; S.items.set(id, { ...it, id }); S.chunkOf.set(id, d.id); n++; }
      S.chunkSize.set(d.id, n);
    }
    S.loaded.chunks = true;
    if (editing?.id && !S.items.has(editing.id)) closeEditor(false);
    scheduleRender();
  }, err => { console.error(err); toast('讀取資料出錯，請重新整理'); });
  db.doc('meta/settings').onSnapshot(snap => {
    S.settings = snap.exists ? snap.data() : { categories: [], rates: {} };
    S.loaded.settings = true;
    scheduleRender();
  }, err => console.error(err));
  db.collection('orders').onSnapshot(snap => {
    S.orders.clear();
    for (const d of snap.docs) S.orders.set(d.id, { ...d.data(), id: d.id });
    S.loaded.orders = true;
    scheduleRender();
  }, err => console.error(err));
}
boot();
})();
</script>

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
